name: Regenerate profile README

on:
  push:
    branches: [main]
    paths:
      - "readme.source.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/readme-aura.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build README and SVGs
        run: npm run build
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
      - name: Commit generated README and SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets stats.json
          git diff --cached --quiet || git commit -m "chore: regenerate profile README"
          git push
